name: 'Pull Request Description'
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened

permissions: {}

jobs:
  enforce:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read  # pr-description-enforcer reads the PR body

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: rudderlabs/pr-description-enforcer@1354172a4395fcfaa645b59cf8ef3cefa19e4f6d # v1.1.0
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
